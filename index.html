    <script type="module">

   <script>
   const playerMarkers = {};
   
   const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [-87.6298, 41.8781],
        zoom: 14 // Increased zoom so vector tile data includes small POIs & streets
    });

    const labelWords = [
        "Kevin", "Kevan", "Keven", "Kevyn", "Jason",
        "Riley", "Reilly", "Rileigh", "Rilee", "Rylee", "Ryleigh", "Ryley", "Rylie",
        "Robert", "Bobby", "Royster", "Smoke", "Sesh",
        "Thomas", "Tomas", "Everest", "Cheeky", "Tiki",
        "Cole", "Serfass",
        "Sam", "Allan",
        "Pete", "Petrov", "Pedro", "Pyotr", "Bradl",
        "Dani", "Toast", "Morken", "Morkin", "Bread",
        "Kellen",
        "Michael", "Mikhail", "Larkin", "Larken",
        "Simon",
        "Ryan", "Cross",
        "Christian", "Cristiano", "Booth",
        "David",
        "Marshall", "Bower",
        "Justice",
        "Chase",
        "Ransom",
        "Shayne",
        "Boy", "Boi",
        "LaBagh Woods"
    ];

    // Safely check if lowercase feature name contains target word
    function makeWordFilter() {
    const wordConditions = labelWords.flatMap(word => {
        const searchWord = word.toLowerCase();
        return [
            // Check primary local name
            [
                "all",
                ["has", "name"],
                [">=", ["index-of", searchWord, ["downcase", ["get", "name"]]], 0]
            ],
            // Check primary English name
            [
                "all",
                ["has", "name:en"],
                [">=", ["index-of", searchWord, ["downcase", ["get", "name:en"]]], 0]
            ]
        ];
    });

    return ["any", ...wordConditions];
}

    function addLabelLayer(id, sourceLayer, vectorSourceId) {
        map.addLayer({
            id: id,
            type: "symbol",
            source: vectorSourceId,
            "source-layer": sourceLayer,
            filter: makeWordFilter(),
            layout: {
                "text-field": [
                    "case",
                    ["has", "name:en"], ["get", "name:en"],
                    ["has", "name"], ["get", "name"],
                    ""
                ],
                "text-size": 15,
                "text-allow-overlap": true,
                "text-ignore-placement": true,
                "text-anchor": "center",
                "text-font": ["Noto Sans Regular"]
            },
            paint: {
                "text-color": "#ff0000", // Red text for high visibility while testing
                "text-halo-color": "#ffffff",
                "text-halo-width": 3
            }
        });
    }

    map.on("load", () => {
        // 1. Hide default text/icon symbols
        map.getStyle().layers.forEach(layer => {
            if (layer.type === "symbol") {
                map.setLayoutProperty(layer.id, "visibility", "none");
            }
        });

        // 2. Automatically detect the correct vector source ID (e.g. 'openfreemap')
        const sources = map.getStyle().sources;
        const vectorSourceId = Object.keys(sources).find(
            key => sources[key].type === 'vector'
        );

        if (!vectorSourceId) {
            console.error("No vector source found in style.");
            return;
        }

        // 3. Add custom layers using the detected vector source ID
        const targetSourceLayers = [
            "poi",
            "place",
            "transportation_name",
            "water_name",
            "waterway",
            "mountain_peak"
        ];

        targetSourceLayers.forEach(layerName => {
            addLabelLayer(`custom-${layerName}-labels`, layerName, vectorSourceId);
        });

// ============================================================
// PLAYER LOCATION SHARING
// ============================================================

// Ask the player who they are
let playerName = prompt(
    "Enter your team name:"
);

// Use a default if they leave it blank
if (!playerName || playerName.trim() === "") {
    playerName = "Unknown";
}

// Remove characters that aren't good for Firebase paths
playerName = playerName
    .trim()
    .replace(/[.#$[\]\/]/g, "_");

// Firebase location for this player
const playerLocationRef =
    window.firebaseRef(
        window.firebaseDatabase,
        "players/" + playerName
    );

const isKevin =
    playerName.toLowerCase() === "kevin";

// Watch the phone's GPS
let locationUpdateCount = 0;

navigator.geolocation.watchPosition(
    (position) => {
        locationUpdateCount++;

        console.log("GPS UPDATE #" + locationUpdateCount);

        const longitude =
            position.coords.longitude;

        const latitude =
            position.coords.latitude;

        console.log(
            "My location:",
            latitude,
            longitude
        );

        // Update our location in Firebase
        window.firebaseSet(
            playerLocationRef,
            {
                latitude: latitude,
                longitude: longitude,
                lastUpdate: Date.now()
            }
        );
    },

    (error) => {
    alert(
        "Location error\n" +
        "Code: " + error.code + "\n" +
        "Message: " + error.message
    );

    console.log("Location error:", error);
},

    {
        enableHighAccuracy: true,
        maximumAge: 2000,
        timeout: 10000
    }
);


// ============================================================
// PLAYER COLORS
// ============================================================

const playerColors = [
    "#e6194b",
    "#3cb44b",
    "#4363d8",
    "#f58231",
    "#911eb4",
    "#42d4f2",
    "#f032e6",
    "#bfef45",
    "#469990",
    "#9A6324",
    "#800000",
    "#000075"
];

let nextPlayerColor = 0;

const playerColorMap = {};


// ============================================================
// KEVIN: SHOW OTHER PLAYERS AND UPDATE THEM LIVE
// ============================================================

if (isKevin) {

    const playersRef =
        window.firebaseRef(
            window.firebaseDatabase,
            "players"
        );

    window.firebaseOnValue(
        playersRef,
        (snapshot) => {

            const players =
                snapshot.val() || {};

            console.log("Firebase player update:", players);

            Object.entries(players).forEach(
                ([name, data]) => {

                    // Never show Kevin
                    if (
                        name.toLowerCase() === "kevin"
                    ) {
                        return;
                    }

                    // Ignore invalid locations
                    if (
                        !data ||
                        typeof data.latitude !== "number" ||
                        typeof data.longitude !== "number"
                    ) {
                        return;
                    }

                    const position = [
                        data.longitude,
                        data.latitude
                    ];

                    console.log(
                        "Moving marker:",
                        name,
                        position
                    );

                    // Create marker the first time
                    if (!playerMarkers[name]) {

                        playerMarkers[name] =
                            new maplibregl.Marker()
                                .setLngLat(position)
                                .setPopup(
                                    new maplibregl.Popup()
                                        .setText(name)
                                )
                                .addTo(map);

                    }

                    // Move marker every time Firebase changes
                    else {

                        playerMarkers[name]
                            .setLngLat(position);

                    }

                }
            );

        }
    );
}

});
</script>
